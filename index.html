<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />

<meta name="description" content="Banco de 20 preguntas de repaso sobre superficies extendidas (aletas), convección y radiación. Universidad de América, Transferencia de Calor I. Orden de preguntas y respuestas aleatorio en cada intento." />
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --ink:#1e2233; --muted:#6b7280;
    --line:#e5e7eb; --accent:#4f46e5; --accent-soft:#eef2ff;
    --ok:#16a34a; --ok-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; justify-content:center; padding:24px 16px 56px;
  }
  .wrap{width:100%; max-width:780px}
  header.card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:18px;
  }
  h1{font-size:1.35rem; margin:0 0 6px; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:.92rem; margin:0 0 14px}
  .meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px 18px; margin:0; padding:0; list-style:none}
  .meta li{font-size:.9rem; border-left:3px solid var(--accent-soft); padding-left:10px}
  .meta b{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px;
  }
  .bar{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:6px}
  .bar > i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .25s ease}
  .progress{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); margin-bottom:16px}
  .qtext{font-size:1.06rem; font-weight:600; margin:0 0 16px}
  .opts{display:grid; gap:10px}
  button.opt{
    all:unset; display:block; width:100%; text-align:left; cursor:pointer;
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:.97rem;
    background:#fff; transition:background .12s, border-color .12s, transform .06s;
  }
  button.opt:hover:not(:disabled){background:var(--accent-soft); border-color:#c7d2fe}
  button.opt:active:not(:disabled){transform:scale(.995)}
  button.opt:disabled{cursor:default}
  button.opt.correct{background:var(--ok-soft); border-color:var(--ok); color:#14532d}
  button.opt.wrong{background:var(--bad-soft); border-color:var(--bad); color:#7f1d1d}
  button.opt.dim{opacity:.55}
  .key{display:inline-block; min-width:22px; font-size:.78rem; font-weight:700; color:var(--muted); margin-right:8px}
  .feedback{margin-top:16px; padding:14px 16px; border-radius:10px; font-size:.93rem; border:1px solid var(--line); background:#f9fafb}
  .feedback.ok{background:var(--ok-soft); border-color:#a7f3d0}
  .feedback.bad{background:var(--bad-soft); border-color:#fecaca}
  .feedback h3{margin:0 0 6px; font-size:.95rem}
  .feedback p{margin:0}
  .actions{margin-top:18px; display:flex; gap:10px; flex-wrap:wrap}
  .btn{
    all:unset; cursor:pointer; border-radius:10px; padding:11px 18px; font-weight:600; font-size:.95rem;
    background:var(--accent); color:#fff; text-align:center;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .btn.ghost:hover{background:#f3f4f6; filter:none}
  .score{font-size:2.1rem; font-weight:800; margin:4px 0 2px; letter-spacing:-.02em}
  .review{margin-top:20px; display:grid; gap:14px}
  .review .item{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:#fff}
  .review .item.bad{border-left:4px solid var(--bad)}
  .review .item.good{border-left:4px solid var(--ok)}
  .review h4{margin:0 0 8px; font-size:.95rem}
  .review p{margin:4px 0; font-size:.9rem}
  .tag{display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:99px; text-transform:uppercase}
  .tag.bad{background:var(--bad-soft); color:var(--bad)}
  .tag.good{background:var(--ok-soft); color:var(--ok)}
  footer{color:var(--muted); font-size:.8rem; text-align:center; margin-top:22px; line-height:1.5}
  sub,sup{font-size:.72em}
  .hint{font-size:.8rem; color:var(--muted); margin-top:12px}
  @media (max-width:520px){
    body{padding:12px 10px 40px}
    .card, header.card{padding:18px 16px}
  }
</style>

<script>
/* ============================================================================
   1) DATOS DEL PROYECTO  —  ✏️ EDITA ESTE BLOQUE CON TUS DATOS

const PROYECTO = {
  titulo:       "Quiz: Aletas, Convección y Radiación",

/* ============================================================================
   2) BANCO DE PREGUNTAS
   - question:      enunciado corto (puede incluir HTML: <sub>, <sup>, &infin;)
   - options:       lista de alternativas; la primera es la CORRECTA al cargar
   - correctIndex:  índice de la respuesta correcta dentro de `options`
   - rationale:     retroalimentación que se muestra al responder
   El programa mezcla el orden de las preguntas y de las opciones en cada intento.
   ========================================================================== */
const PREGUNTAS = [
  {
    question: "¿Para qué sirve la longitud corregida L<sub>c</sub> en aletas?",
    options: [
      "Para usar la fórmula de punta adiabática en aletas reales que sí pierden calor por la punta",

    options: [

      "Aumenta Re pero disminuye h",
      "No cambia nada: h no depende de la velocidad",
      "Solo cambia el número de Prandtl"
    ],

/* ============================================================================
   3) LÓGICA DEL QUIZ
   ========================================================================== */

/** Algoritmo de Fisher-Yates: mezcla un arreglo sin modificar el original. */
function shuffle(lista){
  const a = lista.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Construye una ronda nueva: mezcla preguntas y, dentro de cada una, las opciones. */
function nuevaRonda(){
  return shuffle(PREGUNTAS).map(p => {
    const opciones = shuffle(
      p.options.map((texto, i) => ({ texto, correcta: i === p.correctIndex }))
    );
    return { pregunta: p, opciones, elegida: null };
  });
}

let ronda = [];
let actual = 0;
let aciertos = 0;

const app = document.getElementById("app");

/* --- Cabecera --- */
document.getElementById("titulo").textContent = PROYECTO.titulo;
document.getElementById("bajada").textContent = PROYECTO.bajada;
document.getElementById("m-universidad").textContent = PROYECTO.universidad;
document.getElementById("m-profesor").textContent = PROYECTO.profesor;
document.getElementById("m-materia").textContent = PROYECTO.materia;
document.getElementById("m-tema").textContent = PROYECTO.tema;
document.getElementById("m-estudiante").textContent = PROYECTO.estudiante;
document.getElementById("m-periodo").textContent = PROYECTO.periodo;
document.getElementById("pie").innerHTML =
  PROYECTO.universidad + " · " + PROYECTO.materia + " · Prof. " + PROYECTO.profesor +
  "<br>Repositorio en GitHub: " + PROYECTO.repositorio;

function pantallaInicio(){
  actual = 0; aciertos = 0;
  app.innerHTML =
    '<p class="qtext">' + PREGUNTAS.length + ' preguntas de opción múltiple para repasar antes del examen.</p>' +
    '<p style="margin:0 0 4px; color:var(--muted); font-size:.93rem">' +
      'Cada vez que inicies un intento, las preguntas y sus alternativas se reordenan al azar. ' +
      'Al responder verás la justificación de la respuesta correcta y, al final, tu puntaje con el repaso de los errores.' +
    '</p>' +
    '<div class="actions">' +
      '<button class="btn" id="btn-start">Comenzar el quiz</button>' +
    '</div>';
  document.getElementById("btn-start").onclick = () => { ronda = nuevaRonda(); pintarPregunta(); };
}

function pintarPregunta(){
  const item = ronda[actual];
  const n = actual + 1;
  const pct = ((actual) / ronda.length) * 100;

  app.innerHTML =
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="progress"><span>Pregunta ' + n + ' de ' + ronda.length + '</span>' +
      '<span>Aciertos: ' + aciertos + '</span></div>' +
    '<p class="qtext">' + item.pregunta.question + '</p>' +
    '<div class="opts" id="opts"></div>' +
    '<div id="fb"></div>' +
    '<p class="hint">También puedes responder con las teclas 1 a 4.</p>';

  const cont = document.getElementById("opts");
  item.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="key">' + (i + 1) + '</span>' + op.texto;
    b.onclick = () => responder(i);
    cont.appendChild(b);
  });
}

function responder(i){
  const item = ronda[actual];
  if(item.elegida !== null) return;          // ya respondida
  item.elegida = i;
  const acerto = item.opciones[i].correcta;
  if(acerto) aciertos++;

  const botones = document.querySelectorAll("#opts .opt");
  botones.forEach((b, k) => {
    b.disabled = true;
    if(item.opciones[k].correcta) b.classList.add("correct");
    else if(k === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  document.getElementById("fb").innerHTML =
    '<div class="feedback ' + (acerto ? "ok" : "bad") + '">' +
      '<h3>' + (acerto ? "✔ Correcto" : "✘ Incorrecto") + '</h3>' +
      '<p>' + item.pregunta.rationale + '</p>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn" id="btn-next">' +
        (actual + 1 < ronda.length ? "Siguiente pregunta" : "Ver resultado") +
      '</button>' +
    '</div>';
  document.getElementById("btn-next").onclick = () => {
    if(actual + 1 < ronda.length){ actual++; pintarPregunta(); } else { pantallaFinal(); }
  };
  document.getElementById("btn-next").focus();
}

function pantallaFinal(){
  const total = ronda.length;
  const pct = Math.round((aciertos / total) * 100);
  const comentario =
    pct >= 90 ? "¡Excelente dominio del tema!" :
    pct >= 70 ? "Buen resultado, repasa los detalles." :
    pct >= 50 ? "Vas por buen camino: repasa la teoría." :
                "Conviene volver a estudiar el tema e intentarlo de nuevo.";

  let html =
    '<div class="progress"><span>Resultado final</span></div>' +
    '<p class="qtext">Terminaste el intento</p>' +
    '<div class="score">' + aciertos + ' / ' + total + '</div>' +
    '<p style="margin:0; color:var(--muted)">' + pct + '% de aciertos · ' + comentario + '</p>' +
    '<div class="actions">' +
      '<button class="btn" id="btn-again">Intentar de nuevo (nuevo orden)</button>' +
      '<button class="btn ghost" id="btn-home">Volver al inicio</button>' +
    '</div>' +
    '<h3 style="margin:26px 0 4px; font-size:1rem">Repaso pregunta por pregunta</h3>' +
    '<div class="review">';

  ronda.forEach((item, n) => {
    const elegida = item.opciones[item.elegida];
    const correcta = item.opciones.find(o => o.correcta);
    const ok = elegida.correcta;
    html +=
      '<div class="item ' + (ok ? "good" : "bad") + '">' +
        '<h4>' + (n + 1) + '. ' + item.pregunta.question +
          ' <span class="tag ' + (ok ? "good" : "bad") + '">' + (ok ? "correcta" : "revisar") + '</span></h4>' +
        '<p><b>Tu respuesta:</b> ' + elegida.texto + '</p>' +
        (ok ? "" : '<p><b>Respuesta correcta:</b> ' + correcta.texto + '</p>') +
        '<p style="color:var(--muted)">' + item.pregunta.rationale + '</p>' +
      '</div>';
  });
  html += '</div>';
  app.innerHTML = html;

  document.getElementById("btn-again").onclick = () => { ronda = nuevaRonda(); actual = 0; aciertos = 0; pintarPregunta(); };
  document.getElementById("btn-home").onclick = pantallaInicio;
}

/* Atajos de teclado: 1-4 para responder, Enter para avanzar. */
document.addEventListener("keydown", e => {
  const opts = document.querySelectorAll("#opts .opt");
  if(opts.length && !opts[0].disabled){
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= opts.length){ responder(n - 1); return; }
  }
  if(e.key === "Enter"){
    const next = document.getElementById("btn-next");
    if(next) next.click();
  }
});

pantallaInicio();
</script>
